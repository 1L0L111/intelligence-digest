[project]
name = "intelligence-digest"
version = "1.0.0"
description = "Explainable event-centric IT/InfoSec digest agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "pydantic-settings>=2.4",
  "httpx>=0.27", "feedparser>=6.0", "trafilatura>=1.12", "beautifulsoup4>=4.12",
  "numpy>=1.26", "scikit-learn>=1.5", "sentence-transformers>=3.0", "openai>=1.40",
  "python-docx>=1.1", "jinja2>=3.1", "streamlit>=1.38", "pandas>=2.2", "openpyxl>=3.1"
]
[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "frontend*", "scripts*", "docs*", "data*", "artifacts*", "submission*"]

[tool.poetry]
package-mode = false
